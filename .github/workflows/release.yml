name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Assemble release notes
        run: node .github/scripts/release-notes.mjs --version "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"
      - name: Verify the tag matches the package version
        run: test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Check whether the version is already published
        id: registry
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$GITHUB_REF_NAME" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.exists == 'false'
        run: npm publish --provenance --access public
      - name: Pack the plugin bundle
        run: pnpm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(node -p "require('./package.json').name")-$GITHUB_REF_NAME.tgz"
          gh release create "$GITHUB_REF_NAME" --title "v$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" "$tarball"
