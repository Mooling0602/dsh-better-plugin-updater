name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read the release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          version="${subject#release: v}"
          if [ "${version}" = "${subject}" ] || ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the head commit subject must be 'release: v<version>'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if gh release view "${version}" > /dev/null 2>&1; then
            echo "::notice::release v${version} already exists; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release v${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Verify the commit names this version
        run: test "$(node -p "require('./package.json').version")" = "${VERSION}"
      - name: Assemble release notes
        run: node .github/scripts/release-notes.mjs "${VERSION}" --tag "${VERSION}" --repo "${GITHUB_REPOSITORY}" --output "$RUNNER_TEMP/release-notes.md"
      - name: Check whether the version is already published
        id: registry
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.exists == 'false'
        run: npm publish --provenance --access public
      - name: Pack the plugin bundle
        run: pnpm pack
      - name: Tag the release commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git tag -a "${VERSION}" -m "commit $(git rev-parse --short=7 HEAD)"
          test "$(git rev-list -n1 "${VERSION}")" = "${GITHUB_SHA}"
          git push origin "${VERSION}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(node -p "require('./package.json').name")-${VERSION}.tgz"
          gh release create "${VERSION}" --title "v${VERSION}" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" "${tarball}"
